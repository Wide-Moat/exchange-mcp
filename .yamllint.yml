extends: default

# Helm templates are Go templates that render to YAML; helm lint and kubeconform check what they render.
ignore: |
  charts/*/templates/

rules:
  line-length:
    max: 120
  # GitHub's `on:` key is parsed as the boolean true by a strict YAML reader.
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
  document-start: disable
