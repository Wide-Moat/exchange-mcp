{{- if .Values.ingress.enabled }}
{{- $host := .Values.publicUrl | trimPrefix "https://" | regexFind "^[^/:]+" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "exchange-mcp.fullname" . }}
  labels: {{- include "exchange-mcp.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tlsSecretName }}
  tls:
    - hosts: [{{ $host | quote }}]
      secretName: {{ . }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        # Only what people and MCP clients use: never `/`, so the health and readiness answers and anything
        # added later stay inside the cluster.
        paths:
          {{- range list "/mcp" "/.well-known/" "/authorize" "/token" "/register" "/signin" "/static/" "/files/" "/adfs/" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "exchange-mcp.fullname" $ }}
                port:
                  name: http
          {{- end }}
{{- end }}
