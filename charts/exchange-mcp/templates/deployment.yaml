{{- include "exchange-mcp.validate" . }}
{{- $stage := include "exchange-mcp.stagesSecret" . }}
{{- $init := include "exchange-mcp.initContainer" . }}
{{- $state := .Values.state }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "exchange-mcp.fullname" . }}
  labels: {{- include "exchange-mcp.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- if and (include "exchange-mcp.sharedState" .) (ne .Values.key.provider "memory") }}
  # A rolling update keeps the server up through a deploy: old and new pods share the key and the store.
  # A new key (key.revision) replaces every pod; until that rollout ends, an old pod refuses what a new
  # pod sealed, and the person signs in again.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  {{- else }}
  # State in the pod (or a key born in it): two pods must never serve together, or a sign-in code could
  # be redeemed on each. A deploy is a few seconds without the server.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels: {{- include "exchange-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "exchange-mcp.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{ end }}
      annotations:
        # a new key from CI restarts the pods, which stage it again
        exchange-mcp/key-revision: {{ .Values.key.revision | quote }}
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{ end }}
    spec:
      # the server never calls the Kubernetes API: no API token in the pod
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Spread over nodes when there are several; never refuses to schedule.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- include "exchange-mcp.selectorLabels" . | nindent 14 }}
      {{- if $init }}
      initContainers:
        # The only container that mounts the Secrets. It copies the keys (and the state store's passwords)
        # to a memory volume as files that the server's user alone may read; the server container never
        # sees a Secret. The same image, so staging needs no registry the server does not already need.
        - name: stage-keys
          image: {{ include "exchange-mcp.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - python
            - -m
            - exchange_mcp.keys.stage
            {{- if $stage }}
            - /secret
            {{- else }}
            - /secret-state:state-
            {{- end }}
            - /run/exchange-mcp
            {{- if and $stage $state.existingSecret }}
            - /secret-state:state-
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            {{- if $stage }}
            - name: secret
              mountPath: /secret
              readOnly: true
            {{- end }}
            {{- if $state.existingSecret }}
            - name: secret-state
              mountPath: /secret-state
              readOnly: true
            {{- end }}
            - name: keys
              mountPath: /run/exchange-mcp
      {{- end }}
      containers:
        - name: server
          image: {{ include "exchange-mcp.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8000
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
          env:
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            {{- with .Values.trustedProxies }}
            - name: EXCHANGE_MCP_TRUSTED_PROXIES
              value: {{ join "," . | quote }}
            {{- end }}
            - name: EXCHANGE_MCP_METRICS_PORT
              value: {{ .Values.metrics.port | quote }}
            {{- if $state.url }}
            - name: EXCHANGE_MCP_STATE_URL
              value: {{ $state.url | quote }}
            {{- if ne (int $state.db) 0 }}
            - name: EXCHANGE_MCP_STATE_DB
              value: {{ $state.db | quote }}
            {{- end }}
            {{- else if $state.sentinel.hosts }}
            - name: EXCHANGE_MCP_STATE_SENTINELS
              value: {{ join "," $state.sentinel.hosts | quote }}
            - name: EXCHANGE_MCP_STATE_SENTINEL_MASTER
              value: {{ $state.sentinel.master | quote }}
            - name: EXCHANGE_MCP_STATE_DB
              value: {{ $state.db | quote }}
            - name: EXCHANGE_MCP_STATE_TLS
              value: {{ $state.tls | quote }}
            {{- end }}
            {{- if $state.username }}
            - name: EXCHANGE_MCP_STATE_USERNAME
              value: {{ $state.username | quote }}
            {{- end }}
            {{- if $state.existingSecret }}
            - name: EXCHANGE_MCP_STATE_PASSWORD_FILE
              value: /run/exchange-mcp/state-password
            {{- if $state.sentinel.hosts }}
            - name: EXCHANGE_MCP_STATE_SENTINEL_PASSWORD_FILE
              value: /run/exchange-mcp/state-sentinelPassword
            {{- end }}
            {{- end }}
            - name: EXCHANGE_MCP_PUBLIC_URL
              value: {{ .Values.publicUrl | quote }}
            - name: EXCHANGE_MCP_EWS_URL
              value: {{ .Values.exchange.ewsUrl | quote }}
            - name: EXCHANGE_MCP_TIMEZONE
              value: {{ .Values.exchange.timezone | quote }}
            {{- if .Values.exchange.caBundle.configMap }}
            - name: EXCHANGE_MCP_CA_BUNDLE
              value: /etc/exchange-mcp/ca/{{ .Values.exchange.caBundle.key }}
            {{- end }}
            - name: EXCHANGE_MCP_AUTH_MODE
              value: {{ .Values.auth.mode | quote }}
            {{- if eq .Values.auth.mode "password" }}
            - name: EXCHANGE_MCP_LOGIN_DOMAIN
              value: {{ .Values.auth.password.loginDomain | quote }}
            - name: EXCHANGE_MCP_LOGIN_FORMAT
              value: {{ .Values.auth.password.loginFormat | quote }}
            - name: EXCHANGE_MCP_REFRESH_HOURS
              value: {{ .Values.auth.password.refreshHours | quote }}
            {{- with .Values.auth.password.loginAlso }}
            - name: EXCHANGE_MCP_LOGIN_ALSO
              value: {{ join "," . | quote }}
            {{- end }}
            {{- else }}
            - name: EXCHANGE_MCP_ADFS_ISSUER
              value: {{ .Values.auth.adfs.issuer | quote }}
            - name: EXCHANGE_MCP_ADFS_CLIENT_ID
              value: {{ .Values.auth.adfs.clientId | quote }}
            - name: EXCHANGE_MCP_ADFS_RESOURCE
              value: {{ .Values.auth.adfs.resource | quote }}
            - name: EXCHANGE_MCP_ADFS_KEY_ID
              value: {{ .Values.auth.adfs.keyId | quote }}
            - name: EXCHANGE_MCP_ADFS_KEY_FILE
              value: /run/exchange-mcp/{{ .Values.auth.adfs.signingKeySecretKey }}
            {{- end }}
            - name: EXCHANGE_MCP_KEY_PROVIDER
              value: {{ .Values.key.provider | quote }}
            {{- if eq .Values.key.provider "file" }}
            - name: EXCHANGE_MCP_KEY_FILE
              value: /run/exchange-mcp/{{ .Values.key.secretKey }}
            {{- else if eq .Values.key.provider "vault" }}
            - name: EXCHANGE_MCP_VAULT_ADDR
              value: {{ .Values.key.vault.addr | quote }}
            - name: EXCHANGE_MCP_VAULT_KEY_NAME
              value: {{ .Values.key.vault.keyName | quote }}
            - name: EXCHANGE_MCP_VAULT_MOUNT
              value: {{ .Values.key.vault.mount | quote }}
            - name: EXCHANGE_MCP_VAULT_TOKEN_FILE
              value: /run/exchange-mcp/{{ .Values.key.vault.tokenSecretKey }}
            {{- end }}
            {{- with .Values.areas }}
            - name: EXCHANGE_MCP_AREAS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.clientHosts }}
            - name: EXCHANGE_MCP_CLIENT_HOSTS
              value: {{ join "," . | quote }}
            {{- end }}
          # On the metrics port, which the Ingress never routes. Ready: the key seals and opens (the state
          # store does not decide: its outage must not empty the Service). Alive: the process answers.
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 5
            timeoutSeconds: 3  # /readyz waits at most 0.5 s for the store, and never fails on it
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            timeoutSeconds: 3
            periodSeconds: 30
            failureThreshold: 3
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $init }}
            - name: keys
              mountPath: /run/exchange-mcp
              readOnly: true
            {{- end }}
            {{- if .Values.exchange.caBundle.configMap }}
            - name: ca
              mountPath: /etc/exchange-mcp/ca
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            {{- with .Values.tmp.medium }}
            medium: {{ . }}
            {{- end }}
            sizeLimit: {{ .Values.tmp.sizeLimit }}
        {{- if $init }}
        - name: keys
          emptyDir:
            medium: Memory  # tmpfs, gone with the pod; on the node's disk only if the node swaps
            sizeLimit: 1Mi
        {{- end }}
        {{- if $stage }}
        - name: secret
          secret:
            secretName: {{ .Values.key.existingSecret }}
            defaultMode: 0440  # root:fsGroup; the init container reads it through the pod's group
        {{- end }}
        {{- if $state.existingSecret }}
        - name: secret-state
          secret:
            secretName: {{ $state.existingSecret }}
            defaultMode: 0440
        {{- end }}
        {{- if .Values.exchange.caBundle.configMap }}
        - name: ca
          configMap:
            name: {{ .Values.exchange.caBundle.configMap }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
