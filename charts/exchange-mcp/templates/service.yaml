apiVersion: v1
kind: Service
metadata:
  name: {{ include "exchange-mcp.fullname" . }}
  labels: {{- include "exchange-mcp.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "exchange-mcp.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    # for Prometheus inside the cluster; the Ingress routes only `http`
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
