# exchange-mcp. Every key is documented in charts/exchange-mcp/README.md.

image:
  repository: ghcr.io/wide-moat/exchange-mcp
  tag: ""  # defaults to the chart's appVersion
  digest: ""  # sha256:… pins the image; wins over tag
  pullPolicy: IfNotPresent
imagePullSecrets: []

# The address people and AI clients reach this server at (https). Required.
publicUrl: ""

exchange:
  # The EWS endpoint of one Exchange installation. Required. Autodiscover is never used.
  ewsUrl: ""
  # A CA bundle for an Exchange certificate issued by an internal CA: a ConfigMap and its key.
  caBundle:
    configMap: ""
    key: ca.crt
  timezone: UTC

auth:
  # password: people sign in with their AD password on this server's page (NTLM to EWS).
  # adfs: Modern Auth through AD FS; needs Exchange 2019 CU13+ or Subscription Edition. Not yet run live.
  mode: password
  password:
    loginDomain: ""  # UPN suffix (corp.example) or NetBIOS name with loginFormat down_level
    loginFormat: upn
    loginAlso: []  # more UPN suffixes accepted on the sign-in page
    refreshHours: 12
  adfs:
    issuer: ""
    clientId: ""
    resource: ""
    keyId: ""
    # the private key for private_key_jwt, as a key of the Secret named in key.existingSecret
    signingKeySecretKey: adfs.pem

key:
  # file:   a key generated by CI, in a Secret. Recommended without a secrets manager.
  # vault:  a Vault/OpenBao transit key; the key never enters the pod.
  # memory: generated at start, lost at exit; one replica, everyone signs in again after a restart.
  provider: file
  # The Secret CI writes. It is mounted only into the init container, which copies it to a memory volume
  # readable by the server's user alone; the server container never mounts the Secret.
  existingSecret: ""
  secretKey: key
  # CI sets this to the new key id on every key change, so the pods restart and read the new key.
  revision: ""
  vault:
    addr: ""
    keyName: ""
    mount: transit
    tokenSecretKey: vault-token  # a key of key.existingSecret

areas: []  # empty: every area; or a subset of mail, calendar, people, contacts, tasks
clientHosts: []  # empty: any https or loopback redirect URI may register

replicaCount: 1

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  tlsSecretName: ""  # the host is taken from publicUrl

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
