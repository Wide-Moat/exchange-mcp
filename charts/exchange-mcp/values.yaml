# exchange-mcp. Every key is documented in charts/exchange-mcp/README.md.

image:
  repository: ghcr.io/wide-moat/exchange-mcp
  tag: ""  # defaults to the chart's appVersion
  digest: ""  # sha256:… pins the image; wins over tag
  pullPolicy: IfNotPresent
imagePullSecrets: []

# The address people and AI clients reach this server at (https). Required.
publicUrl: ""

exchange:
  # The EWS endpoint of one Exchange installation. Required. Autodiscover is never used.
  ewsUrl: ""
  # A CA bundle for an Exchange certificate issued by an internal CA: a ConfigMap and its key.
  caBundle:
    configMap: ""
    key: ca.crt
  timezone: UTC

auth:
  # password: people sign in with their AD password on this server's page (NTLM to EWS).
  # adfs: Modern Auth through AD FS; needs Exchange 2019 CU13+ or Subscription Edition. Not yet run live.
  mode: password
  password:
    loginDomain: ""  # UPN suffix (corp.example) or NetBIOS name with loginFormat down_level
    loginFormat: upn
    loginAlso: []  # more UPN suffixes accepted on the sign-in page
    refreshHours: 12
  adfs:
    issuer: ""
    clientId: ""
    resource: ""
    keyId: ""
    # the private key for private_key_jwt, as a key of the Secret named in key.existingSecret
    signingKeySecretKey: adfs.pem

key:
  # file:   a key generated by CI, in a Secret. Recommended without a secrets manager.
  # vault:  a Vault/OpenBao transit key; the key never enters the pod.
  # memory: generated at start, lost at exit; one replica only (each pod would hold its own key), and
  #         everyone signs in again after a restart.
  provider: file
  # The Secret CI writes. It is mounted only into the init container, which copies it to a memory volume
  # readable by the server's user alone; the server container never mounts the Secret.
  existingSecret: ""
  secretKey: key
  # CI sets this to the new key id on every key change, so the pods restart and read the new key.
  revision: ""
  vault:
    addr: ""
    keyName: ""
    mount: transit
    tokenSecretKey: vault-token  # a key of key.existingSecret

areas: []  # empty: every area; or a subset of mail, calendar, people, contacts, tasks
clientHosts: []  # empty: any https or loopback redirect URI may register

# More than one replica (or autoscaling) needs the shared state store below: the chart refuses it otherwise.
replicaCount: 2

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  # Set: also scale on mcp_http_requests_in_flight per pod (a Pods metric served by prometheus-adapter).
  inFlightPerPod: null

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# Prometheus metrics on a port of their own; the Service names it `metrics`, the Ingress never routes it.
# The same port answers /healthz and /readyz, and the probes use it.
metrics:
  port: 9090
  serviceMonitor:
    enabled: false  # needs the Prometheus Operator's CRDs
    interval: 30s
    labels: {}

# The shared state store: used sign-in codes, sign-in attempt windows, the send bucket, upload marks.
# Redis or Valkey, standalone (url) or behind Sentinel (sentinel.hosts). Empty: kept in the pod's memory,
# which is correct for one replica only. No credential or session is ever kept there.
state:
  url: ""  # redis://host:6379/0 or rediss://host:6380/0, no credentials in it
  sentinel:
    hosts: []  # [sentinel-0.example:26379, ...]
    master: mymaster
  db: 0
  tls: false  # Sentinel mode; with url, the scheme decides
  username: ""  # an ACL user, when the store has one
  # A Secret with `password` and, in Sentinel mode, `sentinelPassword` (the same value when the sentinels
  # share it). Staged by the init container like the key; empty for a store without a password.
  existingSecret: ""

service:
  type: ClusterIP
  port: 80

# The proxies (ingress controllers) whose X-Forwarded-For names the client: addresses or CIDR networks.
# Empty: the per-network sign-in limit is off (behind a proxy every person would share one bucket), and
# only the per-login limit applies.
trustedProxies: []

# DEBUG, INFO, WARNING, ERROR. Lines are JSON whatever the level; libraries whose lower levels carry
# request URLs stay at WARNING.
logLevel: INFO

# /tmp of the server: nothing is spooled there, so a small memory volume.
tmp:
  medium: Memory
  sizeLimit: 16Mi


ingress:
  enabled: false
  className: ""
  annotations: {}
  tlsSecretName: ""  # the host is taken from publicUrl

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
