# Every check this repository has, self-contained: nothing here calls a workflow in another
# repository, because a public repository cannot call one in a private repository (the run fails to
# start, with zero jobs and no log). Hosted runners only: a public repository must never run outside
# contributions on our own machines.
name: validate

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: validate-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # No real organisation's data in tracked files: addresses, public IPs, notes in Russian.
  purity:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python scripts/purity_check.py .

  yaml:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: pipx run yamllint==1.35.1 --strict .

  # No secret in the tree or the history. The binary is pinned by version and checksum, so a
  # moved tag cannot change what runs here.
  secrets:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks over every commit
        shell: bash
        run: |
          set -euo pipefail
          v=8.21.2
          base=https://github.com/gitleaks/gitleaks/releases/download
          curl -fsSL -o gl.tgz "$base/v${v}/gitleaks_${v}_linux_x64.tar.gz"
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks
          ./gitleaks git . --no-banner --redact --exit-code 1

  # Static analysis and the dependency scan report findings in the run summary; a scan that did not
  # happen fails.
  semgrep:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: scan
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check "semgrep==1.174.0"
          semgrep scan --config=p/security-audit --config=p/secrets --metrics=off --quiet \
            --timeout 180 --json --output semgrep.json
          test -s semgrep.json || { echo "semgrep produced no report: the scan did not run"; exit 1; }
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          import subprocess
          import sys
          report = json.load(open("semgrep.json"))
          scanned = {p for p in report.get("paths", {}).get("scanned", []) if p.endswith(".py")}
          # semgrep skips tests/ by default; the code that ships and the gate scripts must be scanned
          tracked = subprocess.run(["git", "ls-files", "src/*.py", "scripts/*.py"],
                                   capture_output=True, text=True, check=True)
          want = set(tracked.stdout.split())
          if not want or want - scanned:
              print(f"semgrep scanned {len(scanned & want)} of {len(want)} tracked Python files")
              sys.exit(1)
          errors = [e for e in report.get("errors", []) if e.get("level") == "error"]
          for e in errors:
              print("semgrep error:", e.get("type"), e.get("path"), str(e.get("message"))[:200])
          if errors:
              sys.exit(1)
          results = report["results"]
          print(f"## Semgrep: {len(results)} findings in {len(want)} Python files")
          for r in results[:40]:
              print(f"- {r['check_id'].split('.')[-1]} `{r['path']}`:{r['start']['line']}")
          PY

  sca:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TRIVY_VERSION: 0.73.0
      TRIVY_SHA256: 2edd39da482bb4e9831962487b68f68e3928ec3137794757f54d00383d79547b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install the pinned trivy
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL --retry 3 --connect-timeout 20 --max-time 300 -o /tmp/trivy.tar.gz "$url"
          echo "${TRIVY_SHA256}  /tmp/trivy.tar.gz" | sha256sum -c -
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy && chmod +x /tmp/trivy
          /tmp/trivy --version | head -1 | grep -q "$TRIVY_VERSION"
      - name: scan the working tree
        shell: bash
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2
        run: |
          set -euo pipefail
          /tmp/trivy fs --scanners vuln,misconfig,secret --no-progress --timeout 10m \
            --severity CRITICAL,HIGH --list-all-pkgs --format json -o sca.json .
          test -s sca.json || { echo "trivy produced no report: the scan did not run"; exit 1; }
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          results = json.load(open("sca.json")).get("Results") or []
          # uv.lock is the dependency source requirements.lock is exported from; trivy must have read it.
          locks = [r for r in results if r.get("Target") == "uv.lock" and r.get("Packages")]
          if not locks:
              raise SystemExit("trivy read no packages from uv.lock: the dependency scan covered nothing")
          kinds = ("Vulnerabilities", "Misconfigurations", "Secrets")
          found = [(r.get("Target"), k, x) for r in results for k in kinds for x in (r.get(k) or [])]
          pkgs = len(locks[0]["Packages"])
          print(f"## Dependency scan: {pkgs} packages from uv.lock, {len(found)} HIGH/CRITICAL findings")
          for target, kind, x in found[:40]:
              name = x.get("VulnerabilityID") or x.get("ID") or x.get("RuleID")
              print(f"- {x.get('Severity')} {kind} {name} `{target}`")
          PY

  tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: install the locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements-test.lock
          python -m pip install --no-deps -e .
      # Real servers for the state-store contract suite: Valkey and Redis, standalone and behind Sentinel,
      # with and without a password. No fake: the run fails below if any test was skipped.
      - name: Valkey, Redis and their Sentinels
        run: |
          set -euo pipefail
          scripts/stores-test.sh up | sed 's/^export //' > stores.env
          grep -q '^REDIS_TEST_SENTINELS=' stores.env
          while IFS= read -r line; do
            case "$line" in VALKEY_TEST_PASSWORD=*) echo "::add-mask::${line#*=}";; esac
            echo "$line" >> "$GITHUB_ENV"
          done < stores.env
      - name: format and lint
        run: |
          python -m ruff format --check src tests scripts
          python -m ruff check src tests scripts
      - name: the tests pass
        run: python -m pytest -q -p no:cacheprovider --junitxml=report.xml
      - name: the suite is not empty and every collected test ran
        # A collection error or a skipped module leaves a suite that runs nothing and passes.
        # The floor is derived from the tests on disk, not a number chosen once.
        run: |
          defined=$(grep -rhoE '^\s*(async )?def test_[a-z0-9_]+' tests | wc -l | tr -d ' ')
          ran=$(python scripts/junit_ran.py report.xml)
          skipped=$(python scripts/junit_ran.py report.xml --skipped)
          echo "$defined test functions on disk, $ran test cases ran, $skipped skipped"
          if [ "$skipped" -ne 0 ]; then
            echo "a skipped test is one that did not run here: the Valkey servers are missing"; exit 1
          fi
          if [ "$defined" -lt 150 ]; then
            echo "fewer test functions than this repository has: the check itself is broken"; exit 2
          fi
          if [ "$ran" -lt "$defined" ]; then
            echo "$((defined - ran)) test functions did not run"; exit 1
          fi
      - name: the catalogue fits the token budget
        shell: bash
        run: |
          set -euo pipefail
          python -m exchange_mcp.budget --check | tee budget.md
          echo "## Token budget (default areas)" >> "$GITHUB_STEP_SUMMARY"
          cat budget.md >> "$GITHUB_STEP_SUMMARY"
          python -m exchange_mcp.budget --all --check > /dev/null
      - name: every safety rule is caught by a test when it is broken
        run: python scripts/mutation_check.py
      - name: the tool surface matches its lock
        run: python -m exchange_mcp.surface --check
      - name: docs/tools.md matches the registry
        run: |
          python -m exchange_mcp.docs > /tmp/tools.md
          diff -u docs/tools.md /tmp/tools.md

  budget-comment:
    # The table on the pull request, so the cost of a change is read before it merges.
    # Not on a fork's pull request: its token is read-only and the comment would fail a green run.
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --require-hashes -r requirements-test.lock
          python -m pip install --no-deps -e .
          python -m exchange_mcp.budget > budget.md
      - name: post or update the comment
        # curl and the REST API: a self-hosted runner need not have the gh CLI.
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${TOKEN}" -H "Accept: application/vnd.github+json")
          { echo "<!-- exchange-budget -->"; echo "### Token budget"; echo; cat budget.md; } > body.md
          payload=$(python -c 'import json,sys; print(json.dumps({"body": open("body.md").read()}))')
          id=$(curl -fsS "${auth[@]}" "${api}/issues/${PR}/comments?per_page=100" \
               | python scripts/comment_id.py)
          if [ -n "$id" ]; then
            curl -fsS -X PATCH "${auth[@]}" "${api}/issues/comments/${id}" -d "$payload" > /dev/null
          else
            curl -fsS -X POST "${auth[@]}" "${api}/issues/${PR}/comments" -d "$payload" > /dev/null
          fi
          echo "budget comment posted on #${PR}"

  image:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: install the pinned trivy
        env:
          TRIVY_VERSION: 0.73.0
          TRIVY_SHA256: 2edd39da482bb4e9831962487b68f68e3928ec3137794757f54d00383d79547b
        run: |
          set -euo pipefail
          base="https://github.com/aquasecurity/trivy/releases/download"
          curl -fsSL --retry 3 --connect-timeout 20 --max-time 300 -o /tmp/trivy.tar.gz \
            "${base}/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  /tmp/trivy.tar.gz" | sha256sum -c -
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy && chmod +x /tmp/trivy
      # What publish.yml runs before it pushes: both architectures built once, scanned and started.
      - name: the image builds, passes the scan and starts on amd64 and arm64
        run: TRIVY=/tmp/trivy scripts/build-image.sh /tmp/image

  # The chart renders, refuses what it must, and in a real cluster delivers the key the way it promises:
  # the Secret in the init container only, no key in the environment, the key kept across a container
  # restart and replaced by a new one from CI (scripts/chart-e2e.sh counts its own checks).
  chart:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: chart, image and package carry one version
        run: |
          set -euo pipefail
          py=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          chart=$(sed -n 's/^version: //p' charts/exchange-mcp/Chart.yaml)
          app=$(sed -n 's/^appVersion: "\(.*\)"$/\1/p' charts/exchange-mcp/Chart.yaml)
          echo "pyproject ${py}, chart ${chart}, appVersion ${app}"
          test -n "$py" && test "$py" = "$chart" && test "$py" = "$app"
      - name: tools
        run: |
          set -euo pipefail
          helm version --short && kind version && kubectl version --client=true | head -1
          curl -fsSL --retry 3 -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  /tmp/kubeconform.tar.gz" \
            | sha256sum -c -
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
      - name: renders valid manifests, and refuses what it must
        run: |
          set -euo pipefail
          ok=(--set publicUrl=https://mcp.example.com --set exchange.ewsUrl=https://mail.example.com/EWS/Exchange.asmx
              --set auth.password.loginDomain=corp.example --set key.existingSecret=exchange-mcp-key
              --set state.url=redis://valkey:6379/0)
          helm lint --strict charts/exchange-mcp "${ok[@]}"
          helm template t charts/exchange-mcp "${ok[@]}" > rendered.yaml
          /tmp/kubeconform -strict -summary rendered.yaml
          grep -q 'name: stage-keys' rendered.yaml
          grep -q 'path: /readyz' rendered.yaml
          test "$(grep -c '^kind: PodDisruptionBudget$' rendered.yaml)" = 1
          # one pod, no store: allowed, and the server keeps the state in memory
          helm template t charts/exchange-mcp "${ok[@]}" --set state.url= --set replicaCount=1 > one.yaml
          /tmp/kubeconform -strict -summary one.yaml
          if grep -q EXCHANGE_MCP_STATE one.yaml; then echo "a store is configured with none set"; exit 1; fi
          # Sentinel with a password Secret, the HPA on CPU and in-flight requests, the ServiceMonitor
          helm template t charts/exchange-mcp "${ok[@]}" --set state.url= \
            --set 'state.sentinel.hosts={s-0:26379,s-1:26379}' --set state.existingSecret=store \
            --set autoscaling.enabled=true --set autoscaling.inFlightPerPod=20 \
            --set metrics.serviceMonitor.enabled=true > scaled.yaml
          /tmp/kubeconform -strict -summary -skip ServiceMonitor scaled.yaml
          test "$(grep -c '^kind: HorizontalPodAutoscaler$' scaled.yaml)" = 1
          test "$(grep -c '^kind: ServiceMonitor$' scaled.yaml)" = 1
          grep -q 'name: mcp_http_requests_in_flight' scaled.yaml
          grep -q -- '- /secret-state:state-' scaled.yaml
          grep -q 'value: "s-0:26379,s-1:26379"' scaled.yaml
          grep -q 'value: /run/exchange-mcp/state-sentinelPassword' scaled.yaml
          if grep -q '^  replicas:' scaled.yaml; then echo "replicas set although the HPA owns them"; exit 1; fi
          # probes on the metrics port; no CPU limit anywhere
          python3 scripts/chart_rendered.py rendered.yaml
          python3 scripts/chart_rendered.py scaled.yaml
          python3 scripts/chart_rendered.py one.yaml
          grep -q 'type: Recreate' one.yaml || { echo "one replica without a store is not Recreate"; exit 1; }
          grep -q 'type: RollingUpdate' rendered.yaml || { echo "replicas with a store do not roll"; exit 1; }
          helm template t charts/exchange-mcp "${ok[@]}" --set service.type=LoadBalancer > lb.yaml
          python3 scripts/chart_rendered.py lb.yaml
          # the Ingress routes named paths only, never /
          helm template t charts/exchange-mcp "${ok[@]}" --set ingress.enabled=true > paths.yaml
          if grep -Eq 'path: /$' paths.yaml; then echo "the Ingress routes /"; exit 1; fi
          for p in /mcp /.well-known/ /authorize /token /register /signin /static/ /files/ /adfs/; do
            grep -q "path: $p\$" paths.yaml || { echo "the Ingress does not route $p"; exit 1; }
          done
          # the optional Ingress renders, is valid, and takes its host from publicUrl
          helm template t charts/exchange-mcp "${ok[@]}" --set ingress.enabled=true --set ingress.className=nginx \
            --set ingress.tlsSecretName=mcp-tls > ingress.yaml
          /tmp/kubeconform -strict -summary ingress.yaml
          test "$(grep -c '^kind: Ingress$' ingress.yaml)" = 1
          grep -q 'host: "mcp.example.com"' ingress.yaml
          refuses() {
            want="$1"; shift
            if out=$(helm template t charts/exchange-mcp "$@" 2>&1); then echo "rendered: $*"; exit 1; fi
            grep -qF "$want" <<<"$out" || { echo "refused for another reason: $out"; exit 1; }
            echo "refused as expected: $want"
          }
          # signature: a bare `off` in a values file is YAML false, and must still render as off
          printf 'signature: off\n' > sig-off.yaml
          helm template t charts/exchange-mcp "${ok[@]}" -f sig-off.yaml > sig.yaml
          grep -A1 'name: EXCHANGE_MCP_SIGNATURE' sig.yaml | grep -q 'value: "off"' \
            || { echo "a bare signature: off did not render as off"; exit 1; }
          grep -A1 'name: EXCHANGE_MCP_SIGNATURE' rendered.yaml | grep -q 'value: "owa"' \
            || { echo "the default signature is not owa"; exit 1; }
          refuses "publicUrl is required"
          refuses "key.existingSecret is required" "${ok[@]}" --set key.existingSecret=
          refuses "needs state.url or state.sentinel.hosts" "${ok[@]}" --set state.url=
          refuses "needs state.url or state.sentinel.hosts" "${ok[@]}" --set state.url= --set replicaCount=1 \
            --set autoscaling.enabled=true
          refuses "key.provider memory holds one key per pod" "${ok[@]}" --set key.provider=memory
          refuses "two different stores" "${ok[@]}" --set 'state.sentinel.hosts={s:26379}'
          refuses "state.existingSecret is set but no store is" "${ok[@]}" --set state.url= --set replicaCount=1 \
            --set state.existingSecret=store
          refuses "signature is owa or off" "${ok[@]}" --set signature=always
      - name: build the image for the cluster
        run: docker build -t exchange-mcp:e2e .
      - name: the image reports the chart's version
        run: |
          set -euo pipefail
          got=$(docker run --rm --entrypoint python exchange-mcp:e2e \
            -c 'import exchange_mcp; print(exchange_mcp.__version__)')
          want=$(sed -n 's/^appVersion: "\(.*\)"$/\1/p' charts/exchange-mcp/Chart.yaml)
          echo "image ${got}, chart appVersion ${want}"
          test -n "$want" && test "$got" = "$want"
      - name: a cluster, with metrics-server for the HPA
        run: |
          set -euo pipefail
          kind create cluster --name e2e --wait 120s
          kind load docker-image exchange-mcp:e2e --name e2e
          curl -fsSL --retry 3 -o /tmp/metrics-server.yaml "$METRICS_SERVER_URL"
          echo "$METRICS_SERVER_SHA256  /tmp/metrics-server.yaml" | sha256sum -c -
          kubectl apply -f /tmp/metrics-server.yaml
          # kind's kubelets serve a self-signed certificate
          kubectl -n kube-system patch deploy metrics-server --type=json \
            -p '[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
        env:
          METRICS_SERVER_URL: https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.7.2/components.yaml
          METRICS_SERVER_SHA256: f103539a54ed72efe66616afc74a8bfaed651703cb3918797599046af5617441
      - name: the chart in the cluster
        run: IMAGE=exchange-mcp:e2e scripts/chart-e2e.sh
      - name: what the cluster saw
        if: failure()
        run: kubectl --request-timeout=30s get pods -A -o wide || true

  # The replica checks of scripts/chart-e2e.sh against 0.1.7, the last image that kept its state in each
  # process: every one of them must fail there. A check that passes against it proves nothing.
  chart-known-bad:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      OLD: ghcr.io/wide-moat/exchange-mcp@sha256:4e243d7a379e312540028b1ee1a60f7d7d8ab71bf74074a19e1a089747505287
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: a cluster with the 0.1.7 image
        run: |
          set -euo pipefail
          docker pull -q "$OLD" && docker tag "$OLD" exchange-mcp:known-bad
          kind create cluster --name e2e --wait 120s
          kind load docker-image exchange-mcp:known-bad --name e2e
      - name: every replica check fails against it
        run: IMAGE=exchange-mcp:known-bad KNOWN_BAD=1 scripts/chart-e2e.sh
      - name: what the cluster saw
        if: failure()
        run: kubectl --request-timeout=30s get pods -A -o wide || true

  probe:
    # The built image starts as a non-root user, refuses a key in the environment, and serves OAuth
    # metadata with a key file it generated the way a deployment would.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build
        run: docker build -t exchange-mcp:ci .
      - name: a key in the environment stops the server
        run: |
          set -uo pipefail
          set +e  # the server is expected to refuse to start; the step checks why
          out=$(docker run --rm -e EXCHANGE_MCP_PUBLIC_URL=https://mcp.example.com \
            -e EXCHANGE_MCP_EWS_URL=https://mail.example.com/EWS/Exchange.asmx -e EXCHANGE_MCP_AUTH_MODE=password \
            -e EXCHANGE_MCP_LOGIN_DOMAIN=corp.example -e EXCHANGE_MCP_KEY_PROVIDER=memory \
            -e EXCHANGE_MCP_SECRET=abcdefabcdefabcdefabcdefabcdefabcdef exchange-mcp:ci 2>&1); code=$?
          set -e
          echo "$out" | tail -3
          test "$code" -ne 0 && echo "$out" | grep -q "never read from the environment"
      - name: starts with a generated key file and answers
        run: |
          set -euo pipefail
          mkdir -p keys && printf 'k1:%s\n' "$(openssl rand 32 | basenc --base64url | tr -d '=')" > keys/key
          chmod 0400 keys/key && sudo chown 10001 keys/key
          docker run -d --name mcp -p 127.0.0.1:8000:8000 -v "$PWD/keys:/run/keys:ro" \
            -e EXCHANGE_MCP_PUBLIC_URL=https://mcp.example.com \
            -e EXCHANGE_MCP_EWS_URL=https://mail.example.com/EWS/Exchange.asmx -e EXCHANGE_MCP_AUTH_MODE=password \
            -e EXCHANGE_MCP_LOGIN_DOMAIN=corp.example -e EXCHANGE_MCP_KEY_PROVIDER=file \
            -e EXCHANGE_MCP_KEY_FILE=/run/keys/key exchange-mcp:ci
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/healthz >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS -H 'Host: mcp.example.com' http://127.0.0.1:8000/.well-known/oauth-authorization-server \
            | grep -q '"issuer":"https://mcp.example.com/\?"'
          want="$(docker inspect -f '{{.Config.User}}' exchange-mcp:ci)"; got="$(docker exec mcp id -u)"
          echo "image user ${want}, running as ${got}"; test "$got" = "$want" && test "$got" != 0
      - name: a shell in the container cannot read the server's memory or environment
        run: |
          set -euo pipefail
          # kubectl exec opens a shell as the image user; the server marked itself not dumpable, so /proc
          # of PID 1 belongs to root. Only an exact refusal passes: a dead container or a missing file
          # gives another answer. maps, not mem: mem at offset 0 fails on any process.
          got=$(docker exec -i mcp python - < scripts/proc-probe.py)
          echo "own environ, PID 1 environ, PID 1 maps: ${got}"
          test "$got" = "READ DENIED DENIED"
      - name: server log
        if: always()
        run: docker logs mcp 2>&1 | tail -50 || true
      - name: clean up
        if: always()
        run: docker rm -f mcp >/dev/null 2>&1 || true
