# Publish the image from main and from release tags, scanned before it is pushed. A tag v<x.y.z>
# also gets a GitHub Release whose notes are that version's CHANGELOG section and the digest to pin.
name: publish

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    # No paths filter: a commit that changes only a workflow still needs its image built.
  workflow_dispatch:

permissions:
  contents: read

# One publication per ref at a time; a newer push to main waits for the running one, never cancels it
# (a cancelled publish could leave an image pushed and unscanned).
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Built here rather than by a shared workflow: a public repository cannot call one in a private
  # repository. Tags: sha-<commit> and the branch on main; <x.y.z> and <x.y> on a tag, never latest.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/wide-moat/exchange-mcp
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          # no `latest`: an installation pins a version or a digest
          flavor: |
            latest=false
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Two architectures, one manifest list: amd64 natively, arm64 through QEMU.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: install the pinned trivy
        shell: bash
        env:
          TRIVY_VERSION: 0.73.0
          TRIVY_SHA256: 2edd39da482bb4e9831962487b68f68e3928ec3137794757f54d00383d79547b
        run: |
          set -euo pipefail
          base="https://github.com/aquasecurity/trivy/releases/download"
          curl -fsSL --retry 3 --connect-timeout 20 --max-time 300 -o /tmp/trivy.tar.gz \
            "${base}/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  /tmp/trivy.tar.gz" | sha256sum -c -
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy && chmod +x /tmp/trivy
      # Built once into an archive; each architecture scanned and started before anything is pushed. A
      # failed scan leaves no tag in the registry.
      - name: build, scan and start both architectures
        shell: bash
        env:
          LABELS: ${{ steps.meta.outputs.labels }}
          TRIVY: /tmp/trivy
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r l; do if [ -n "$l" ]; then args+=(--label "$l"); fi; done <<< "$LABELS"
          scripts/build-image.sh /tmp/image "${args[@]}"
      # The archive just checked, pushed as it is: no second build.
      - id: push
        name: push the checked manifest list under every tag
        shell: bash
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          local_digest="sha256:$(skopeo inspect --raw oci-archive:/tmp/image/image.tar | sha256sum | cut -d' ' -f1)"
          pushed=0
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            skopeo copy --quiet --all --preserve-digests --dest-creds "${ACTOR}:${TOKEN}" \
              oci-archive:/tmp/image/image.tar "docker://${t}"
            remote=$(skopeo inspect --raw --creds "${ACTOR}:${TOKEN}" "docker://${t}" | sha256sum | cut -d' ' -f1)
            remote="sha256:${remote}"
            [ "$remote" = "$local_digest" ] || { echo "${t} is ${remote}, not the checked ${local_digest}"; exit 1; }
            pushed=$((pushed + 1))
          done <<< "$TAGS"
          [ "$pushed" -gt 0 ] || { echo "metadata gave no tags: nothing was pushed"; exit 1; }
          echo "pushed ${pushed} tags, digest ${local_digest} (amd64 and arm64)"
          echo "what an installation should pin: ghcr.io/wide-moat/exchange-mcp@${local_digest}"
          echo "digest=${local_digest}" >> "$GITHUB_OUTPUT"

  # The chart, on a tag only: oci://ghcr.io/wide-moat/charts/exchange-mcp:<x.y.z>, after the image it
  # points at was scanned and pushed.
  chart:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # validate.yml (chart lint, schemas, refusals, the kind install) runs on the push to main, not on
      # the tag; the chart is published only for a commit whose validate run passed.
      - name: validate passed on this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Only the push to main counts, and only if its own chart job ran and passed: a run whose chart
          # job was skipped (a draft pull request) concludes success too.
          for _ in $(seq 1 80); do
            ids=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow validate.yml --commit "$SHA" --event push \
              --json databaseId,status,conclusion \
              --jq '.[] | select(.status == "completed" and .conclusion == "success") | .databaseId')
            pending=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow validate.yml --commit "$SHA" --event push \
              --json status --jq '[.[] | select(.status != "completed")] | length')
            for id in $ids; do
              chart=$(gh run view "$id" --repo "$GITHUB_REPOSITORY" --json jobs \
                --jq '[.jobs[] | select(.name == "chart") | .conclusion] | first // "absent"')
              echo "validate run ${id} on ${SHA}: chart job ${chart}"
              if [ "$chart" = success ]; then exit 0; fi
            done
            done_runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow validate.yml --commit "$SHA" \
              --event push --json status --jq '[.[] | select(.status == "completed")] | length')
            if [ "$done_runs" -gt 0 ] && [ "$pending" -eq 0 ]; then
              echo "no passing validate run on this commit passed its chart job: the chart is not published"; exit 1
            fi
            sleep 30
          done
          echo "no finished validate run on this commit after 40 minutes"; exit 1
      - name: package and push
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          meta=charts/exchange-mcp/Chart.yaml
          grep -qx "version: ${version}" "$meta" || { echo "Chart.yaml is not ${version}"; exit 1; }
          grep -qx "appVersion: \"${version}\"" "$meta" || { echo "appVersion is not ${version}"; exit 1; }
          helm package charts/exchange-mcp --destination /tmp/chart
          pkg="/tmp/chart/exchange-mcp-${version}.tgz"
          test -s "$pkg" || { echo "no package ${pkg}"; exit 1; }
          echo "$TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          helm push "$pkg" oci://ghcr.io/wide-moat/charts
          helm show chart oci://ghcr.io/wide-moat/charts/exchange-mcp --version "$version" \
            | grep -qx "version: ${version}"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [image, chart]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: notes from CHANGELOG, the version must have its section
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          grep -qx "version = \"${version}\"" pyproject.toml || { echo "pyproject.toml is not ${version}"; exit 1; }
          awk -v v="## ${version}" '$0==v{on=1;next} /^## /{on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section ## ${version}"; exit 1; }
          test -n "$DIGEST" || { echo "the image job returned no digest"; exit 1; }
          printf '\n## Image\n\n`ghcr.io/wide-moat/exchange-mcp@%s`\n' "$DIGEST" >> notes.md
          chart="oci://ghcr.io/wide-moat/charts/exchange-mcp"
          readme="https://github.com/wide-moat/exchange-mcp/blob/${TAG}/charts/exchange-mcp/README.md"
          printf '\n## Chart\n\n`helm upgrade --install exchange-mcp %s --version %s -f values.yaml`\n\n' \
            "$chart" "$version" >> notes.md
          printf 'values.yaml and the key Secret: [chart README](%s).\n' "$readme" >> notes.md
      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md --verify-tag
