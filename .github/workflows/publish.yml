# Publish the image from main and from release tags, then scan exactly what was pushed. A tag v<x.y.z>
# also gets a GitHub Release whose notes are that version's CHANGELOG section and the digest to pin.
name: publish

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    # No paths filter: a commit that changes only a workflow still needs its image built.
  workflow_dispatch:

permissions:
  contents: read

# One publication per ref at a time; a newer push to main waits for the running one, never cancels it
# (a cancelled publish could leave an image pushed and unscanned).
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: Wide-Moat/ci/.github/workflows/image-build.yml@main
    with:
      runner: ${{ vars.CI_BUILD_RUNNER || vars.CI_RUNNER || 'ubuntu-latest' }}
      image: ghcr.io/wide-moat/exchange-mcp
      push: true

  trivy:
    needs: image
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      packages: read
    env:
      TRIVY_VERSION: 0.73.0
      IMAGE: ghcr.io/wide-moat/exchange-mcp@${{ needs.image.outputs.digest }}
    steps:
      - name: install the pinned trivy
        run: |
          set -uo pipefail
          url="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL --retry 3 --connect-timeout 20 --max-time 300 -o /tmp/trivy.tar.gz "$url"
          size=$(wc -c < /tmp/trivy.tar.gz)
          [ "$size" -gt 10000000 ] || { echo "archive is only ${size} bytes"; exit 1; }
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy && chmod +x /tmp/trivy
          /tmp/trivy --version | head -1 | grep -q "$TRIVY_VERSION"
      - name: no HIGH or CRITICAL vulnerability with a fix in the pushed image
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
        run: |
          set -uo pipefail
          /tmp/trivy image --no-progress --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --format json -o /tmp/scan.json "$IMAGE"
          python3 - <<'PY'
          import json, sys
          d = json.load(open("/tmp/scan.json"))
          results = d.get("Results") or []
          packages = sum(len(r.get("Packages") or []) for r in results) if results else 0
          vulns = [v for r in results for v in (r.get("Vulnerabilities") or [])]
          print(f"{len(results)} targets scanned, {len(vulns)} fixable HIGH/CRITICAL")
          if not results:
              print("trivy scanned nothing: the image did not load"); sys.exit(2)
          for v in vulns:
              print(v["VulnerabilityID"], v.get("PkgName"), v.get("InstalledVersion"), "->", v.get("FixedVersion"))
          sys.exit(1 if vulns else 0)
          PY
      - name: what an installation should pin
        run: echo "$IMAGE"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [image, trivy]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: notes from CHANGELOG, the version must have its section
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          grep -qx "version = \"${version}\"" pyproject.toml || { echo "pyproject.toml is not ${version}"; exit 1; }
          awk -v v="## ${version}" '$0==v{on=1;next} /^## /{on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section ## ${version}"; exit 1; }
          test -n "$DIGEST" || { echo "the image job returned no digest"; exit 1; }
          printf '\n## Image\n\n`ghcr.io/wide-moat/exchange-mcp@%s`\n' "$DIGEST" >> notes.md
      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md --verify-tag
